name: Build VillagerWorkstation

on:
  push:
    branches: [main, master, feature/fish-collection-tracking]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: gradle --no-daemon clean test build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VillagerWorkstation-0.5.0
          path: build/libs/VillagerWorkstation-0.5.0.jar
          if-no-files-found: error
      - name: Upload All The Fish datapack ZIP
        if: ${{ hashFiles('datapacks/All The Fish 5.1.0 (26.3).zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: All-The-Fish-5.1.0-26.3
          path: datapacks/All The Fish 5.1.0 (26.3).zip
          if-no-files-found: error
      - name: Report missing datapack ZIP
        if: ${{ hashFiles('datapacks/All The Fish 5.1.0 (26.3).zip') == '' }}
        run: echo '::warning::All The Fish ZIP is not committed yet; upload it to datapacks/ before this build can publish the separate datapack artifact.'
