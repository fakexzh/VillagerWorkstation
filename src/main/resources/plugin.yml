name: VillagerWorkstation
version: 0.6.0
main: com.xzh.villagerworkstation.VillagerWorkstationPlugin
api-version: '26.3'
author: XZH
description: XZH custom fishing and specimen collections.
commands:
  vw:
    description: Browse the custom fish catalogue or reload fishing data.
    usage: /vw <fish|reload|help>
permissions:
  villagerworkstation.admin:
    description: Reload fishing configuration and catalogue.
    default: op
