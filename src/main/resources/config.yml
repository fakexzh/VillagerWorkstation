# Independent custom fishing and specimen collection settings.
# Eligible water catches use a 5% custom-fish chance; vanilla catches remain available.
# Fish catalogue data is loaded from fish.yml.
# Custom specimens retain their unique identity, physical dimensions and collection data.
custom-fishing:
  enabled: true
  fish-catalogue: fish.yml
  consume-bait-on-success-only: true
  specimen-identity: true
  physical-size-data: true
