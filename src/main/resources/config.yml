# Custom production is limited to farmer and fisherman workstations only.
# All other villager professions remain vanilla and are not modified by this plugin.
scan-interval-ticks: 40
work-radius: 8
# During daytime, matching farmer/fisherman villagers within this range are guided back to their station.
return-to-work-radius: 32
chest-radius: 8

# Farmers harvest mature wheat, carrots, potatoes and beetroot, replant them,
# and store every harvest drop directly in the copper chest.
farmer-enabled: true

# Fishermen simulate one fish catch per work cycle when water is nearby.
fisherman-fishing-enabled: true
