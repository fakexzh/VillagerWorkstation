# Custom production is limited to farmer and fisherman workstations only.
# All other villager professions remain vanilla and are not modified by this plugin.
scan-interval-ticks: 40
# Horizontal work area: 64 blocks in each direction from the workstation.
work-radius: 64
# Keep the copper chest close to its workstation.
chest-radius: 8

# Farmers harvest mature wheat, carrots, potatoes and beetroot, replant them,
# and store every harvest drop directly in the copper chest. Main crop items are
# limited to 48 of each type per workstation per rolling real-world hour.
farmer-enabled: true
farmer-max-items-per-crop-per-hour: 48

# Fishermen store a mixed catch of at most 48 fish per workstation per rolling real-world hour.
# Catch odds: cod 60%, salmon 30%, tropical fish 6%, pufferfish 4%.
fisherman-fishing-enabled: true
fisherman-max-fish-per-hour: 48

# Fixed probability split for eligible fish catches: 95% vanilla fish / 5% XZH custom fish.
# Luck of the Sea and other fishing enchantments do not modify this plugin-controlled split.
# Inside the 5% custom pool, rarity values are relative weights combined with biome habitat weights:
# Common 10, Uncommon 6, Rare 3, Epic 2, Legendary 0.05, Mythical 0.005.
# Legendary is 20x rarer and Mythical is 100x rarer than their previous relative weights.
# This applies to eligible Overworld water catches and Nether lava/datapack catches.
# Junk and treasure are never replaced. Only genuine custom catches enter fish-collections.yml.
custom-fishing:
  enabled: true
  fish-catalogue: fish.yml
  consume-bait-on-success-only: true
  specimen-identity: true
  physical-size-data: true
